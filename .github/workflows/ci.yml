name: checks
on: [push, pull_request]
jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: every script at least compiles
        run: python -m py_compile asset_gui.py anim_encode.py composite_avatar.py decode_imagearray.py extract_den_items.py mirror_assets.py
      - name: encoders (no game files needed)
        run: |
          python -m pip install pillow
          python tests/test_encoders.py
      - name: the scripts can describe their own options
        run: python asset_gui.py --dump-schema | python -c "import sys,json; d=json.load(sys.stdin); print([s['name'] for s in d['scripts']]); assert len(d['scripts'])>=4"
      - name: the static site builds
        run: python site/build.py --api https://api.example.com --out /tmp/site && test -s /tmp/site/index.html && grep -q API_BASE /tmp/site/config.js
